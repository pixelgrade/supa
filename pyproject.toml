[project]
name = "supa"
version = "0.2.6"
description = "Supa support agent and mailbox client"
requires-python = ">=3.11"
dependencies = ["httpx>=0.26.0"]

[project.scripts]
supa = "supa_cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supa_cli"]
exclude = ["/supa_cli/_build.py"]

[tool.hatch.build.targets.sdist]
exclude = ["/.hgignore"]
include = [
    "/README.md",
    "/pyproject.toml",
    "/supa_cli",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "supa_cli/_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
